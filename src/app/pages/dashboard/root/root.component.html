<div class="layout-container">
  <mat-sidenav-container>
    <mat-sidenav
      #sidenav
      class="sidenav"
      [(mode)]="sideNavMode"
      [(opened)]="sideNavOpened"
    >
      <div class="sidebar-background"></div>
      <app-sidebar></app-sidebar>
    </mat-sidenav>
    <mat-sidenav-content>
      <app-navbar [title]="navBarTitle"></app-navbar>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
